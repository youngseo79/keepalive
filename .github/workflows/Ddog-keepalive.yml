name: Supabase Keepalive
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Insert ping row
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_at\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}")
          echo "Insert response: $RESPONSE"
          [ "$RESPONSE" = "201" ] || { echo "❌ Insert failed"; exit 1; }
          echo "✅ Inserted at $(date -u)"
      - name: Delete oldest rows over 100
        run: |
          CUTOFF_ID=$(curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/ping?select=id&order=pinged_at.desc&limit=1&offset=99" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            | python3 -c "import sys,json; rows=json.load(sys.stdin); print(rows[0]['id'] if rows else '')")
          if [ -z "$CUTOFF_ID" ]; then
            echo "ℹ️ 100행 미만 — 삭제 없음"
          else
            DEL=$(curl -s -o /dev/null -w "%{http_code}" \
              -X DELETE "${{ secrets.SUPABASE_URL }}/rest/v1/ping?id=lt.$CUTOFF_ID" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            echo "🗑️ Delete response: $DEL"
          fi
      - name: Keep workflow alive
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "keepalive: $(date -u +'%Y-%m-%d')"
          git push
